services:
  voicebox:
    build: .
    image: voicebox-local:daneel-20261102-8af7efe
    container_name: voicebox
    restart: unless-stopped
    ports:
      - "0.0.0.0:17493:17493"
    volumes:
      - ./output:/app/data/generations
      - voicebox-data:/app/data
      - huggingface-cache:/home/voicebox/.cache/huggingface
    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - VOICEBOX_STT_URL=http://192.168.68.74:8093
      - VOICEBOX_STT_TOKEN=${VOICEBOX_STT_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    gpus: all
    networks:
      - voicebox-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  voicebox-net:
    driver: bridge

volumes:
  voicebox-data:
  huggingface-cache:
